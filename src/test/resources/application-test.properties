# Configuración para tests
spring.application.name=ServiAutos-Backend-Test

# MongoDB para tests (usar base de datos de test)
spring.data.mongodb.uri=mongodb://localhost:27017
spring.data.mongodb.database=serviautos_test

# Configuración de email para tests (opcional)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=test@example.com
spring.mail.password=test-password

# SendGrid para tests (opcional)
sendgrid.api.key=test-key
sendgrid.from.email=test@example.com
sendgrid.from.name=Test

# Admin para tests
admin.email=admin@test.com

# Puerto para tests
server.port=0
