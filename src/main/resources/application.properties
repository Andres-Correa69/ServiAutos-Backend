spring.application.name=ServiAutos-Backend

# MongoDB (MongoDB Atlas)
spring.data.mongodb.uri=${MONGO_URI}
spring.data.mongodb.database=${MONGO_DB}

# SendGrid Configuration
sendgrid.api.key=${SENDGRID_API_KEY}
sendgrid.from.email=${SENDGRID_FROM_EMAIL}
sendgrid.from.name=${SENDGRID_FROM_NAME:ServiAutos}

# Correo (SMTP Gmail)
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USER}
spring.mail.password=${MAIL_PASS}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_HOST}

# Admin
admin.email=${ADMIN_EMAIL}

# Warranty Configuration
warranty.default-days=30

# Railway - Puerto dinámico
server.port=${PORT:8080}

# Actuator - Métricas y monitoreo
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=when-authorized
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}

# Health Check optimizado para Railway - responde rápido sin verificar servicios pesados
# Deshabilitar todos los health checks pesados que pueden tardar
management.health.defaults.enabled=false
management.health.mongo.enabled=false
management.health.mail.enabled=false
management.health.diskspace.enabled=false
management.health.ping.enabled=true
# Usar solo liveness y readiness que son rápidos
management.endpoint.health.probes.enabled=true
