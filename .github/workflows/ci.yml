name: CI - Run Tests

on:
  push:
    branches:
      - main
      - production
      - develop
  pull_request:
    branches:
      - main
      - production

env:
  JAVA_VERSION: '21'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    # Agregar esto para Testcontainers
    services:
      docker:
        image: docker:dind
        options: --privileged
      
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test
        env:
          MONGO_URI: mongodb://localhost:27017
          MONGO_DB: serviautos_test
          # Variables para tests (no necesitas las reales, solo para que no falle)
          SENDGRID_API_KEY: test-key
          SENDGRID_FROM_EMAIL: test@test.com
          SENDGRID_FROM_NAME: Test
          MAIL_HOST: smtp.gmail.com
          MAIL_PORT: 587
          MAIL_USER: test@test.com
          MAIL_PASS: test
          ADMIN_EMAIL: admin@test.com

      - name: Build application (verificar que compila)
        run: ./gradlew clean build -x test

      - name: Test Results
        if: always()
        run: |
          if [ -f build/test-results/test/TEST-*.xml ]; then
            echo "✅ Tests completed"
          else
            echo "⚠️ No test results found"
          fi
